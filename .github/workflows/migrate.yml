name: migrate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production Neon
        run: pnpm db:migrate
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      - name: Set role passwords (only if the secrets are set)
        run: pnpm db:passwords
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
          ENGINE_RW_PASSWORD: ${{ secrets.ENGINE_RW_PASSWORD }}
          WEB_RO_PASSWORD: ${{ secrets.WEB_RO_PASSWORD }}
