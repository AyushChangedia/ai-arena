name: smoke
on:
  workflow_dispatch:
    inputs:
      check:
        description: What to run
        type: choice
        required: true
        default: doctor
        options:
          - doctor
          - snapshot
          - decide-all
          - record-fixtures
          - roster
      tier:
        description: roster only — budget, flagship or free
        type: choice
        required: false
        default: free
        options:
          - free
          - budget
          - flagship
permissions:
  contents: read
concurrency:
  group: smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      ARENA_MODE: ${{ vars.ARENA_MODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: doctor
        if: inputs.check == 'doctor'
        run: pnpm run doctor
      - name: snapshot
        if: inputs.check == 'snapshot'
        run: pnpm engine snapshot --dry
      - name: decide-all
        if: inputs.check == 'decide-all'
        run: pnpm engine decide --participant all --dry
      - name: record-fixtures
        if: inputs.check == 'record-fixtures'
        run: pnpm engine record-fixtures --out fixtures-out
      - name: roster (public model list, no key needed)
        if: inputs.check == 'roster'
        run: pnpm engine roster --tier "$TIER" --out roster-out/models.json
        env:
          TIER: ${{ inputs.tier }}
      - name: upload fixtures (1-day retention; artifacts on public repos are visible)
        if: inputs.check == 'record-fixtures'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures-out/
          retention-days: 1
      - name: upload proposed roster
        if: inputs.check == 'roster'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roster
          path: roster-out/
          retention-days: 7
