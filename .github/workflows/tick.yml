name: tick
on:
  schedule:
    # Every 10 minutes, 08:32–16:22 IST, Monday–Friday (SPEC §12.1). Minutes ending in 2 avoid top-of-hour congestion.
    - cron: '2-59/10 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (no writes, model calls, alerts or revalidation)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    outputs:
      exported: ${{ steps.tick.outputs.exported }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      ARENA_MODE: ${{ vars.ARENA_MODE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tick
        name: pnpm engine tick
        env:
          DRY: ${{ inputs.dry && '--dry' || '' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
        run: pnpm engine tick $DRY $MANUAL
      - name: upload the day's public data
        if: steps.tick.outputs.exported != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-data
          path: public-data/
          retention-days: 1

  commit:
    needs: tick
    if: needs.tick.outputs.exported != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      BRANCH: ${{ vars.DATA_BRANCH || github.event.repository.default_branch }}
      DATES: ${{ needs.tick.outputs.exported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-data
          path: public-data/
      - name: commit the public data and anchors
        id: commit
        run: |
          git config user.name "ai-arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: ${DATES} [skip ci]"
          git push origin "HEAD:${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.commit.outputs.sha != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.commit.outputs.sha != ''
        with:
          node-version: '24'
          cache: pnpm
      - name: record the anchor commit
        if: steps.commit.outputs.sha != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARENA_MODE: ${{ vars.ARENA_MODE }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm engine anchor-commit --date "$DATES" --sha "$SHA"
